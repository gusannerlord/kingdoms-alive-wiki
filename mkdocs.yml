site_name: Kingdoms Alive Wiki
site_description: Player guide for the Bannerlord mod "Kingdoms Alive - Campaign and Diplomacy Overhaul", which turns your campaign into a living medieval realm in the spirit of Crusader Kings.
site_url: https://gusannerlord.github.io/kingdoms-alive-wiki/
repo_url: https://github.com/gusannerlord/kingdoms-alive-wiki
repo_name: kingdoms-alive-wiki
edit_uri: ""

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/crown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - War and diplomacy:
      - War and peace: features/war-and-peace.md
      - Events between kingdoms: features/events-between-kingdoms.md
      - Winning the council over: features/council.md
      - Vassal realms and annexation: features/vassal-realms.md
      - Command your armies: features/command-your-armies.md
  - Life at court:
      - Feasts and the grand tournament: features/feasts.md
      - Hunts: features/hunts.md
      - Events between clans: features/clan-events.md
      - Civil war: features/civil-war.md
      - The crown and its claim: features/succession.md
      - Envoys: features/envoys.md
      - Your rival: features/rival.md
      - Duels: features/duels.md
      - Lords who remember you: features/memories.md
      - Captives: features/captives.md
  - Your realm and household:
      - The royal court: features/royal-court.md
      - Affairs of your kingdom: features/realm-affairs.md
      - Companion errands: features/companion-errands.md
      - Alayen: features/alayen.md
      - Squire service: features/squire.md
      - The Blackhand's knives: features/lords-enemies.md
      - Mercenary contracts and the Unsworn: features/mercenary-contracts.md
      - The King's Writ: features/kings-writ.md
      - Companies for hire: features/free-companies.md
  - Campaign:
      - Fast mode families: features/fast-mode.md
      - Other changes: features/other-changes.md
  - Settings: settings.md
  - FAQ, bugs and roadmap: faq.md
